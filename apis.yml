name: Valence Discovery
description: >-
  Valence Discovery is an AI-first drug discovery company, now operating as Valence Labs,
  the AI research engine of Recursion. Formed from the merger of Datamol and InVivo AI, the
  team builds machine-learning methods and foundation models for molecular design, cellular
  perturbation prediction, and biological discovery, trained on petabyte-scale phenomics and
  transcriptomics data. Rather than a public REST API, Valence's developer surface is a suite
  of first-party open-source Python libraries - datamol, molfeat, graphium, SAFE and OpenQDC -
  published under the datamol-io and valence-labs GitHub organizations for cheminformatics,
  molecular featurization, graph neural networks and ML-ready quantum datasets.
